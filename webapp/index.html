<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CMD Center</title>
<style>
  :root {
    --bg:#0b0b0c; --panel:#141416; --panel2:#101012; --muted:#8b8d9c; --fg:#e7e8ee;
    --accent:#9aa6c8; --accent2:#9aa6c8; --danger:#ff4a3d; --ok:#8fd674; --warn:#9aa6c8;
    --border:#2a2a2e; --shadow:rgba(0,0,0,0.6);
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:var(--bg); color:var(--fg);
    font:15px/1.3 "DejaVu Sans",system-ui,Arial,sans-serif;
    overflow:hidden; touch-action:manipulation; }

  .topbar { display:flex; align-items:center; gap:14px; padding:10px 16px;
    background:var(--panel2); border-bottom:2px solid var(--border); }
  .title { font-weight:700; font-size:17px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--accent); }
  .tabs { display:flex; gap:8px; flex:1; overflow-x:auto; }
  .tab { padding:10px 16px; border-radius:4px; border:1px solid var(--border); background:var(--panel);
    color:var(--muted); cursor:pointer; font-weight:700; font-size:12px; letter-spacing:.12em;
    text-transform:uppercase; white-space:nowrap; text-decoration:none; }
  .tab.active { background:var(--accent); color:#141414; border-color:var(--accent); }

  .view { display:none; height:calc(100% - 54px); overflow:auto; padding:14px; }
  .view.active { display:block; }
  .wrap { max-width:1400px; margin:0 auto; }

  /* ---------- GAUGE CLUSTER ---------- */
  .cluster { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .gauge { background:var(--panel); border:1px solid var(--border);
    border-radius:6px; padding:12px 14px; min-height:104px; display:flex; flex-direction:column;
    justify-content:space-between; }
  .gauge .label { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
  .gauge .value { font-size:30px; font-weight:700; margin-top:4px; color:var(--fg);
    font-variant-numeric:tabular-nums; }
  .gauge .sub { font-size:11px; color:var(--muted); margin-top:2px; letter-spacing:.06em; }
  .gauge.c-cpu .value, .gauge.c-ram .value { color:var(--fg); }
  .gauge.c-ok .value    { color:var(--ok); }
  .gauge.c-warn .value  { color:var(--warn); }
  .gauge.c-danger .value{ color:var(--danger); }
  /* segmented gauge bar, like an LED cluster readout */
  .bar-wrap { margin-top:10px; height:10px; background:repeating-linear-gradient(90deg,
      #1d1d20 0 6px, #141416 6px 9px); border:1px solid var(--border); border-radius:2px;
    overflow:hidden; }
  .bar { height:100%; background:var(--accent); width:0%; transition:width .5s ease;
    mask-image:repeating-linear-gradient(90deg, #000 0 6px, transparent 6px 9px);
    -webkit-mask-image:repeating-linear-gradient(90deg, #000 0 6px, transparent 6px 9px); }
  .bar.hot { background:var(--danger); }

  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
  .section { display:flex; flex-direction:column; gap:8px; }
  .group-title { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted);
    margin:6px 0; border-bottom:1px solid var(--border); padding-bottom:4px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .btn { appearance:none; border:1px solid var(--border); background:var(--panel); color:var(--fg);
    padding:12px 16px; border-radius:4px; cursor:pointer; min-height:48px; display:inline-flex;
    align-items:center; justify-content:center; font-weight:700; font-size:12px;
    letter-spacing:.1em; text-transform:uppercase; text-decoration:none; }
  .btn:active { background:var(--accent); color:#141414; border-color:var(--accent); }
  .btn.danger { border-color:var(--danger); color:var(--danger); }
  .btn.accent { border-color:var(--accent); color:var(--accent); }

  .terminal-output { background:var(--panel2); border:1px solid var(--border); border-radius:4px;
    padding:10px; font-size:11px; color:#c9cbd8; height:150px; overflow:auto;
    white-space:pre-wrap; word-break:break-all; }
  .empty { color:var(--muted); font-style:italic; }

  /* ---------- STREAM DECK ---------- */
  .deck { display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:10px; }
  .deck-btn { appearance:none; border:1px solid var(--border);
    background:var(--panel); color:var(--fg); padding:14px 10px;
    border-radius:6px; cursor:pointer; min-height:92px; width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    font-weight:700; font-size:12px; letter-spacing:.1em; text-transform:uppercase;
    text-decoration:none; font-family:inherit; }
  .deck-btn:active { background:var(--accent); color:#141414; border-color:var(--accent); }
  .deck-btn .icon { font-size:24px; line-height:1; filter:grayscale(35%); }
  .deck-btn.accent { border-left:4px solid var(--accent); }
  .deck-btn.accent2 { border-left:4px solid var(--accent); }
  .deck-btn.danger { border-left:4px solid var(--danger); }
  .deck-btn.ok { border-left:4px solid var(--ok); }
  .deck-inline { display:contents; }

  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.12em; font-size:11px; }
  td { font-variant-numeric:tabular-nums; }
  .kv { display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:4px 0; }
  .kv b { color:var(--muted); font-weight:700; }
  .metric { color:var(--accent); font-weight:700; }

  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--accent); color:var(--accent); padding:12px 18px;
    border-radius:4px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:50;
    font-weight:700; font-size:12px; letter-spacing:.1em; text-transform:uppercase; }
  #toast.show { opacity:1; }
  .error { position:fixed; top:0; left:0; right:0; background:var(--danger); color:#141414; padding:8px; font-size:11px; z-index:9999; display:none; }
  iframe[name=cmdframe] { display:none; width:0; height:0; border:0; }
</style>
</head>
<body>
<div class="error" id="error"></div>
<iframe name="cmdframe"></iframe>

<div class="topbar">
  <div class="title">CMD Center</div>
  <div class="tabs">
    <a class="tab active" href="#dashboard">Dashboard</a>
    <a class="tab" href="#services">Services</a>
  </div>
  <a class="tab" href="/system/lock">🔒 Lock</a>
</div>

<!-- ============ DASHBOARD ============ -->
<div class="view active" id="dashboard">
  <div class="wrap">
    <div class="cluster">
      <div class="gauge c-cpu">
        <div><div class="label">CPU</div><div class="value" id="cpu">—</div></div>
        <div><div class="sub" id="cpuSub"></div><div class="bar-wrap"><div class="bar" id="cpuBar"></div></div></div>
      </div>
      <div class="gauge c-ram">
        <div><div class="label">RAM</div><div class="value" id="ram">—</div></div>
        <div><div class="sub" id="ramSub"></div><div class="bar-wrap"><div class="bar" id="ramBar"></div></div></div>
      </div>
      <div class="gauge">
        <div><div class="label">Disk /</div><div class="value" id="disk">—</div></div>
        <div><div class="sub" id="diskSub"></div><div class="bar-wrap"><div class="bar" id="diskBar"></div></div></div>
      </div>
      <div class="gauge">
        <div><div class="label">GPU</div><div class="value" id="gpu">—</div></div>
        <div><div class="sub" id="gpuSub"></div><div class="bar-wrap"><div class="bar" id="gpuBar"></div></div></div>
      </div>
      <div class="gauge c-ok" id="tempCard">
        <div><div class="label">CPU Temp</div><div class="value" id="cpuTemp">—</div></div>
        <div><div class="sub" id="fanSub">thermals</div></div>
      </div>
      <div class="gauge">
        <div><div class="label">Network</div><div class="value" id="netIface" style="font-size:18px">—</div></div>
        <div><div class="sub" id="netAddr"></div></div>
      </div>
      <div class="gauge">
        <div><div class="label">Sessions</div><div class="value" id="users">—</div></div>
        <div><div class="sub" id="usersSub"></div></div>
      </div>
      <div class="gauge">
        <div><div class="label">Uptime</div><div class="value" id="uptime" style="font-size:16px">—</div></div>
        <div><div class="sub" id="loadSub"></div></div>
      </div>
    </div>

    <div class="row2">
      <div class="section">
        <div class="group-title">Top Processes</div>
        <table>
          <thead><tr><th>PID</th><th>CPU%</th><th>MEM%</th><th>Name</th></tr></thead>
          <tbody id="procTable"><tr><td colspan="4" class="empty">loading…</td></tr></tbody>
        </table>
      </div>
      <div class="section">
        <div class="group-title">Workspaces</div>
        <div class="row" id="wsButtons"><span class="empty">loading…</span></div>
        <div class="group-title">Quick Power</div>
        <div class="row">
          <a class="btn" href="/system/sleep">💤 Sleep</a>
          <a class="btn danger" href="/system/reboot">🔄 Reboot</a>
          <a class="btn danger" href="/system/shutdown">⏻ Shutdown</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============ SERVICES ============ -->
<div class="view" id="services">
  <div class="wrap">
    <div class="group-title">Services With Open Ports</div>
    <table>
      <thead><tr><th>Service</th><th>Port</th><th>Address</th><th></th></tr></thead>
      <tbody id="svcTable"><tr><td colspan="4" class="empty">loading…</td></tr></tbody>
    </table>
  </div>
</div>

<div id="toast"></div>
<script>
(function(){
  try {
    var $ = function(s){ return document.querySelector(s); };
    var toast = function(msg){ var t=$('#toast'); if(!t) return; t.textContent=msg;
      t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); },1400); };

    // tabs (enhancement only — dashboard works without JS)
    function showView(id){
      var views=document.querySelectorAll('.view');
      for(var i=0;i<views.length;i++) views[i].classList.remove('active');
      var el=$('#'+id); if(el) el.classList.add('active');
      var tabs=document.querySelectorAll('.tab');
      for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('active', tabs[i].getAttribute('href')==='#'+id);
      try { location.hash=id; } catch(e){}
    }
    var tabs=document.querySelectorAll('.tab');
    for(var i=0;i<tabs.length;i++){
      tabs[i].addEventListener('click', function(e){
        var href=this.getAttribute('href')||'';
        if(href.charAt(0)==='#'){ e.preventDefault(); showView(href.substring(1)); }
      });
    }
    if(location.hash){ var v=location.hash.substring(1); if($('#'+v)) showView(v); }
    window.addEventListener('hashchange', function(){
      var v=location.hash.substring(1);
      if(v && $('#'+v)) showView(v);
    });

    function setBar(barId,pct){
      var b=$(barId); if(!b) return;
      pct=Math.max(0,Math.min(100,pct));
      b.style.width=pct+'%';
      b.className='bar'+(pct>90?' hot':'');
    }

    function refresh(){
      fetch('/system/status').then(function(r){ if(!r.ok) throw new Error(r.statusText); return r.json(); }).then(function(s){
        $('#cpu').textContent=s.cpu+'%';
        setBar('#cpuBar',s.cpu);
        $('#cpuSub').textContent='load '+(s.load?s.load.join(' '):'—');
        $('#ram').textContent=s.ram_pct+'%';
        $('#ramSub').textContent=s.ram_used+' / '+s.ram_total;
        setBar('#ramBar',s.ram_pct);
        $('#disk').textContent=s.disk_pct+'%';
        $('#diskSub').textContent=s.disk_used+' / '+s.disk_total+(s.nvme_temp?('  ·  '+s.nvme_temp+'°C'):'');
        setBar('#diskBar',s.disk_pct);
        $('#gpu').textContent=s.gpu_pct+'%';
        $('#gpuSub').textContent=s.gpu_temp?('temp '+s.gpu_temp+'°C'):'—';
        setBar('#gpuBar',s.gpu_pct);
        var ct=$('#cpuTemp'); ct.textContent=s.cpu_temp?(s.cpu_temp+'°C'):'—';
        $('#tempCard').className='gauge '+(s.cpu_temp>85?'c-danger':(s.cpu_temp>70?'c-warn':'c-ok'));
        var ni=(s.network&&s.network[0])||'—';
        var parts=String(ni).split(/\s+/);
        $('#netIface').textContent=parts[0]||'—';
        $('#netAddr').textContent=parts.slice(1).join(' ')||'';
        $('#users').textContent=s.users;
        $('#usersSub').textContent='logged in';
        $('#uptime').textContent=s.uptime||'—';
        $('#loadSub').textContent='load '+(s.load?s.load.join(' '):'—');
        var pt=$('#procTable'); pt.innerHTML='';
        (s.processes||[]).forEach(function(p){
          var tr=document.createElement('tr');
          tr.innerHTML='<td>'+p.pid+'</td><td>'+p.cpu+'</td><td>'+p.mem+'</td><td>'+p.name+'</td>';
          pt.appendChild(tr);
        });
      }).catch(function(e){
        var d=$('#error'); d.style.display='block'; d.textContent='refresh err: '+e.message;
        setTimeout(function(){ d.style.display='none'; },3000);
      });
      setTimeout(refresh,2000);
    }

    function renderWS(){
      fetch('/config').then(function(r){ return r.json(); }).then(function(cfg){
        var c=$('#wsButtons'); c.innerHTML='';
        (cfg.workspaces||[]).forEach(function(w){
          var a=document.createElement('a');
          a.className='btn';
          a.href='/workspace/switch?index='+w.index;
          a.textContent=w.name;
          c.appendChild(a);
        });
      }).catch(function(){ $('#wsButtons').innerHTML='<span class="empty">unavailable</span>'; });
    }

    function renderServices(){
      fetch('/services/ports').then(function(r){ if(!r.ok) throw new Error(r.statusText); return r.json(); }).then(function(d){
        var t=$('#svcTable'); t.innerHTML='';
        var svcs=d.services||[];
        if(!svcs.length){ t.innerHTML='<tr><td colspan="4" class="empty">no listening services found</td></tr>'; return; }
        svcs.forEach(function(s){
          var tr=document.createElement('tr');
          var open='';
          if(s.url){
            open='<a class="btn accent" href="/open?url='+encodeURIComponent(s.url)+'">Open</a>';
          } else {
            open='<span class="empty">no web ui</span>';
          }
          tr.innerHTML='<td>'+s.service+'</td><td class="metric">'+s.port+'</td><td>'+s.addr+'</td><td style="text-align:right">'+open+'</td>';
          t.appendChild(tr);
        });
      }).catch(function(e){
        $('#svcTable').innerHTML='<tr><td colspan="4" class="empty">unavailable: '+e.message+'</td></tr>';
      });
    }

    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', function(){ renderWS(); refresh(); renderServices(); });
    else { renderWS(); refresh(); renderServices(); }
  } catch(e){
    var d=document.createElement('div');
    d.style.cssText='position:fixed;top:0;left:0;right:0;background:#ff5252;color:#fff;padding:10px;font-size:12px;z-index:9999;';
    d.textContent='Fatal JS: '+e.message; document.body.appendChild(d);
  }
})();
</script>
</body>
</html>
